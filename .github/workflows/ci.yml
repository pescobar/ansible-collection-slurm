name: CI

# Fast, dependency-free checks that run on every push/PR. The live-cluster
# acceptance suites are separate workflows so each can evolve independently:
#   - acceptance-management.yml  accounts/users/QOS (the slurm_acct role) — now
#   - a future acceptance-install.yml for the planned Slurm install role
# and the test-cluster images they use come from build-test-images.yml.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test requirements
        run: pip install pytest

      - name: Run renderer/parser/planner unit tests
        run: python -m pytest tests/unit/ -v

  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ansible-core + ansible-lint
        run: pip install -r tests/requirements.txt

      # ansible-lint needs the collection installed so the FQCN role/module
      # references in the playbooks resolve.
      - name: Install the collection
        run: ansible-galaxy collection install --force . -p /tmp/collections

      - name: Run ansible-lint
        env:
          ANSIBLE_COLLECTIONS_PATH: /tmp/collections
        run: ansible-lint
