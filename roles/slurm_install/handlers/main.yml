---
# Handlers run in this order: munge before the Slurm daemons, slurmdbd
# before slurmctld. Munge and slurmdbd are only notified by drop-in changes;
# their config changes restart them inline (see munge.yml, slurmdbd.yml).
- name: Restart munge
  ansible.builtin.systemd_service:
    name: munge
    state: restarted

- name: Restart slurmdbd
  ansible.builtin.systemd_service:
    name: slurmdbd
    state: restarted

- name: Restart slurmctld
  listen: Slurm config changed
  ansible.builtin.systemd_service:
    name: slurmctld
    state: restarted
  when: _slurm_install_is_controller

- name: Restart slurmd
  listen: Slurm config changed
  ansible.builtin.systemd_service:
    name: slurmd
    state: restarted
  when: _slurm_install_is_worker

- name: Restart sackd
  ansible.builtin.systemd_service:
    name: sackd
    state: restarted
  when:
    - slurm_install_configless | bool
    - _slurm_install_is_submit
    - not _slurm_install_is_controller

# Configless: the workers and submit hosts hold a cached copy, and only
# slurmctld can push the new one. Runs after the restarts above.
- name: Push the new config to the cluster
  listen: Slurm config changed
  ansible.builtin.command: scontrol reconfigure
  changed_when: true
  when:
    - slurm_install_configless | bool
    - _slurm_install_is_controller
