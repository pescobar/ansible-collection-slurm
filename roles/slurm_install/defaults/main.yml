---
# Install and configure a Slurm cluster (static config) from the Ubuntu
# 26.04 archive packages (Slurm 25.11). Run it against every cluster host in
# one play with facts gathered: slurm.conf and /etc/hosts are rendered from
# the facts of all cluster hosts.

# ClusterName in slurm.conf (lowercase). slurm_acct_cluster must match it.
slurm_install_cluster_name: cluster

# Inventory groups selecting what each host runs. The controller group must
# hold exactly one host (slurmctld); workers run slurmd; submit hosts only
# get the client commands and slurm.conf. A group that does not exist is
# treated as empty.
slurm_install_controller_group: slurm_controller
slurm_install_workers_group: slurm_workers
slurm_install_submit_group: slurm_submit

# slurmctld host (SlurmctldHost) and slurmdbd host (AccountingStorageHost).
# Both must be inventory hostnames that equal the machines' short hostnames.
slurm_install_controller_host: "{{ groups[slurm_install_controller_group] | first }}"
slurm_install_dbd_host: "{{ slurm_install_controller_host }}"

# Add every cluster host to /etc/hosts (IP from each host's default_ipv4
# fact). Leave off when DNS already resolves the cluster hostnames.
slurm_install_manage_etc_hosts: false

# Configless mode (https://slurm.schedmd.com/configless_slurm.html): only the
# controller holds /etc/slurm/slurm.conf. slurmd (workers) and sackd (submit
# hosts) fetch it from slurmctld over --conf-server and cache it under
# /run/slurm/conf, so the config files below are deployed to the controller
# only and `scontrol reconfigure` pushes changes out.
slurm_install_configless: false

# host[:port] the workers and submit hosts fetch the config from.
slurm_install_conf_server: "{{ slurm_install_controller_host }}:6817"

# SlurmctldParameters for the built-in slurm.conf, as a list.
# 'enable_configless' is added automatically when slurm_install_configless is
# true, 'idle_on_node_suspend' when cloud scheduling is on (below).
# Example: ['cloud_reg_addrs'] when the nodes' IPs are not in DNS.
slurm_install_slurmctld_parameters: []

# --- Elastic ("cloud") compute nodes on OpenStack -------------------------
# Nodes are created when jobs need them and deleted when they stay idle
# (https://slurm.schedmd.com/elastic_computing.html). The role deploys the
# resume/suspend program on the controller together with the credentials it
# uses. Requires configless mode (the nodes have no local slurm.conf) and
# DNS that resolves the node names to the new VMs.
slurm_install_cloud_scheduling: false

# The nodes Slurm may create, as a list of node groups. 'name' is a Slurm
# hostlist expression; the VM settings become node Features, which the
# resume program reads. Sockets/CoresPerSocket/ThreadsPerCore are optional.
# Example:
#   slurm_install_cloud_nodes:
#     - name: compute-[01-04]
#       cpus: 2
#       real_memory: 3500
#       image: course-compute-image
#       flavor: c002r004
#       network: my-network
#       keypair: my-keypair
#       security_groups: [default, slurm]
#       extra: "MemSpecLimit=512"   # appended to the NodeName line
slurm_install_cloud_nodes: []

# Which partition the cloud nodes join (defaults to the role's partition).
slurm_install_cloud_partition_name: "{{ slurm_install_partition_name }}"

# Power-saving timings (seconds). SuspendTime is how long a node may sit idle
# before it is deleted; ResumeTimeout must cover a VM boot plus slurmd
# registering, or Slurm marks the node DOWN.
slurm_install_cloud_suspend_time: 600
slurm_install_cloud_resume_timeout: 600
slurm_install_cloud_suspend_timeout: 180
# Nodes created/deleted per minute (0 = no limit).
slurm_install_cloud_resume_rate: 4
slurm_install_cloud_suspend_rate: 4
# Nodes/partitions never suspended, e.g. 'static' or 'compute-01'.
slurm_install_cloud_suspend_exc_nodes: ""
slurm_install_cloud_suspend_exc_parts: ""

# Where the resume/suspend program and its log live.
slurm_install_cloud_program_dir: /usr/local/sbin
slurm_install_cloud_log_file: /var/log/slurm/dynamic_nodes.log
slurm_install_cloud_logrotate: true

# The program needs the 'openstack' python module. The role builds a venv for
# it with uv rather than using distro packages, which keeps the sdk version
# under your control and the recipe portable to other distros. uv itself is
# not packaged by Ubuntu, so the role downloads the release binary (checksum
# verified) unless one is already installed.
slurm_install_cloud_venv_path: /opt/slurm-openstack
slurm_install_cloud_openstacksdk: openstacksdk  # e.g. 'openstacksdk==4.8.0' to pin
slurm_install_cloud_uv_install: true
slurm_install_cloud_uv_path: /usr/local/bin/uv
slurm_install_cloud_uv_version: 0.12.17
slurm_install_cloud_uv_url: >-
  https://github.com/astral-sh/uv/releases/download/{{ slurm_install_cloud_uv_version }}/uv-{{
  ansible_facts['architecture'] }}-unknown-linux-gnu.tar.gz
# Interpreter the deployed program runs under; the venv's by default.
slurm_install_cloud_python_interpreter: "{{ slurm_install_cloud_venv_path }}/bin/python3"

# OpenStack credentials for the resume/suspend program, written to
# /etc/openstack/clouds.yaml (0600, owned by SlurmUser) on the controller.
# Use an application credential and keep the secret in ansible-vault.
slurm_install_cloud_name: openstack
slurm_install_cloud_auth_url: ""
slurm_install_cloud_application_credential_id: ""
slurm_install_cloud_application_credential_secret: ""
slurm_install_cloud_region_name: ""
slurm_install_cloud_interface: public
# Set false to keep your own /etc/openstack/clouds.yaml (deployed elsewhere).
slurm_install_cloud_manage_clouds_yaml: true

# Packages per host type (Ubuntu archive names).
slurm_install_packages_common:
  - slurm-client
  - munge
slurm_install_packages_controller:
  - slurmctld
slurm_install_packages_dbd:
  - slurmdbd
  - mariadb-server
  - python3-pymysql  # ansible.mariadb modules
slurm_install_packages_worker:
  - slurmd
# Submit hosts in configless mode: sackd holds the fetched config for the
# client commands (it is not needed when every host has a local slurm.conf).
slurm_install_packages_submit_configless:
  - sackd

# slurmdbd's MariaDB database. The password has no default: set it (vaulted)
# for the dbd host.
slurm_install_dbd_storage_db: slurm_acct_db
slurm_install_dbd_storage_user: slurm
# slurm_install_dbd_storage_password:

# Extra MariaDB server settings, written to
# /etc/mysql/mariadb.conf.d/99-slurmdbd.cnf. SchedMD recommends a buffer pool
# of at least 4 GiB and 5-50% of RAM, and a log file of 25% of the pool
# (slurmdbd logs a warning below 4 GiB).
slurm_install_mariadb_buffer_pool_mb: "{{ [4096, (ansible_facts['memtotal_mb'] * 0.5) | int] | min }}"
slurm_install_mariadb_config: |
  [mysqld]
  innodb_buffer_pool_size={{ slurm_install_mariadb_buffer_pool_mb }}M
  innodb_log_file_size={{ (slurm_install_mariadb_buffer_pool_mb | int / 4) | int }}M
  innodb_lock_wait_timeout=900
  max_allowed_packet=16M

# Config templates. Point any of them at your own template (a path relative
# to the playbook's templates/ dir, or absolute) to replace the built-in one.
slurm_install_slurm_conf_template: slurm.conf.j2
slurm_install_slurmdbd_conf_template: slurmdbd.conf.j2
slurm_install_cgroup_conf_template: cgroup.conf.j2

# Settings used by the built-in slurm.conf.j2. Nodes are generated from each
# worker's facts (sockets, cores, threads, memory) into one partition.
slurm_install_partition_name: compute
# Memory (MB) kept out of each node's RealMemory for the OS.
slurm_install_node_memory_reserve_mb: 0
slurm_install_mpi_default: pmix
# Extra lines appended to the built-in slurm.conf, e.g.
#   slurm_install_slurm_conf_extra: |
#     GresTypes=gpu
#     AccountingStorageTRES=gres/gpu
slurm_install_slurm_conf_extra: ""

# Deploy cgroup.conf to workers (needed for the task/cgroup memory and core
# limits to be enforced).
slurm_install_deploy_cgroup_conf: true

# Take slurm.conf, cgroup.conf, job_submit.lua and any other file from a git
# repo instead of the templates above. The repo is checked out on every
# cluster host and its files are copied over /etc/slurm (the .git dir and
# slurmdbd.conf excluded: slurmdbd.conf holds the DB password and is always
# rendered from the template).
slurm_install_config_git_repo: ""
slurm_install_config_git_version: main
slurm_install_config_git_checkout: /var/lib/slurm-config-git

# job_submit.lua on the controller (enables JobSubmitPlugins=lua in the
# built-in slurm.conf). Empty disables it. The role ships
# job_submit_autoadd.lua.j2, which adds unknown users to accounting on their
# first job with the default account below. Do not combine it with
# slurm_acct_purge: purge deletes those users again.
slurm_install_job_submit_lua_template: ""
slurm_install_job_submit_autoadd_account: root

# systemd drop-ins, keyed by unit (slurmctld, slurmd, slurmdbd, munge),
# written to /etc/systemd/system/<unit>.service.d/override.conf on the hosts
# running that unit. Example:
#   slurm_install_systemd_overrides:
#     slurmd: |
#       [Service]
#       LimitNOFILE=262144
slurm_install_systemd_overrides: {}
