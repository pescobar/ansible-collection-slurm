---
- name: Create the systemd drop-in directories
  ansible.builtin.file:
    path: /etc/systemd/system/{{ item.key }}.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ _slurm_install_overrides }}"
  loop_control:
    label: "{{ item.key }}"

- name: Deploy the systemd drop-ins
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: /etc/systemd/system/{{ item.key }}.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _slurm_install_overrides }}"
  loop_control:
    label: "{{ item.key }}"
  register: _slurm_install_overrides_result
  notify: Restart {{ item.key }}

# Reload now so the services started later in the play use the drop-ins;
# the restarts of already-running services happen at the end of the play.
- name: Reload systemd after drop-in changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: _slurm_install_overrides_result is changed
