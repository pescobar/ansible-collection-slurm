# Self-contained Slurm test cluster for the pescobar.slurm acceptance tests:
# mysql + slurmdbd + slurmctld. slurmdbd and slurmctld share ONE image
# (ghcr.io/pescobar/ansible-collection-slurm/slurm-test:<version>, built from
# the Dockerfile here); only slurmctld starts sshd (the collection drives
# sacctmgr on the controller over SSH — no slurmrestd needed).
#
#   ./generate-ssh-key.sh
#   # pull the published image (fast), or build locally with --build:
#   SLURM_VERSION=25.05.8 docker compose up -d --wait          # pulls
#   SLURM_VERSION=25.05.8 docker compose up -d --wait --build  # builds
#
# The published image carries NO SSH key; the throwaway test key generated by
# generate-ssh-key.sh is bind-mounted into slurmctld at runtime and installed
# by the entrypoint (ENABLE_SSHD=true). See README.md.
#
# Container names are prefixed so this stack can run alongside other Slurm test
# stacks on the same host; hostnames stay mysql/slurmdbd/slurmctld because the
# baked-in slurm.conf/slurmdbd.conf reference them.
#
# The explicit project name below is IMPORTANT: without it, compose derives the
# project from this file's directory basename ("docker"), which collides with
# any other stack whose compose file also lives in a directory called docker/ —
# a `down -v` would then stop that stack's containers and delete its volumes too
# (this actually happened during development).

name: slurm-ansible

# Shared image + local-build definition for both Slurm daemons (compose builds
# the tag once and reuses it for both services).
x-slurm-image: &slurm-image
  image: ghcr.io/pescobar/ansible-collection-slurm/slurm-test:${SLURM_VERSION:?SLURM_VERSION is required}
  build:
    context: .
    args:
      SLURM_VERSION: ${SLURM_VERSION:?SLURM_VERSION is required}

services:
  mysql:
    image: mariadb:12
    hostname: mysql
    container_name: slurm-ansible-mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-slurm_acct_db}
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - var_lib_mysql:/var/lib/mysql
    networks:
      - slurm-ansible
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  slurmdbd:
    <<: *slurm-image
    command: ["slurmdbd"]
    container_name: slurm-ansible-slurmdbd
    hostname: slurmdbd
    environment:
      MYSQL_USER: ${MYSQL_USER:-slurm}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-password}
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
    expose:
      - "6819"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - slurm-ansible
    healthcheck:
      test: ["CMD-SHELL", "pidof slurmdbd"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  slurmctld:
    <<: *slurm-image
    command: ["slurmctld"]
    container_name: slurm-ansible-slurmctld
    hostname: slurmctld
    environment:
      # Start sshd and install the bind-mounted throwaway test key.
      ENABLE_SSHD: "true"
    volumes:
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      - ./.ssh/authorized_keys:/run/ssh-pubkey/authorized_keys:ro
    ports:
      - "2222:22"
    depends_on:
      slurmdbd:
        condition: service_healthy
    networks:
      - slurm-ansible
    healthcheck:
      test: ["CMD-SHELL", "scontrol ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  etc_munge:
  etc_slurm:
  var_lib_mysql:
  var_log_slurm:

networks:
  slurm-ansible:
    driver: bridge
