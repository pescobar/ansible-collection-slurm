---
# Sample inventory: point `slurm_controller` at the host where slurmctld and
# a configured sacctmgr live. Production example:
#
#   slurm_controller:
#     hosts:
#       slurmctld.example.org:
#         ansible_user: root
#
# The tests/ acceptance setup targets the local Docker test cluster
# through the SSH-enabled stack (see tests/docker/) with these same
# group_vars.

slurm_controller:
  hosts:
    slurmctld:
      ansible_host: 127.0.0.1
      ansible_port: 2222
      ansible_user: root
      ansible_ssh_common_args: >-
        -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
