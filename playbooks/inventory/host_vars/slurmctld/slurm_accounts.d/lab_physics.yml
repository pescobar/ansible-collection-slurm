---
lab_physics:
  description: Physics Lab
  organization: physics
  fairshare: 100
  default_qos: standard
  allowed_qos: [standard, high, long, gpu]
  max_tres_per_job:
    - type: cpu
      count: 64
    - type: gres
      name: gpu
      count: 8
  user_associations:
    - alice
    # Per-user GPU cap, tighter than the account's own.
    - user: john
      account_overrides:
        max_tres_per_job:
          - type: cpu
            count: 64
          - type: gres
            name: gpu
            count: 2
